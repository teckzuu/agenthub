<style data-page-node-id="Rv6Jv2orzU5f1bxHKKxElE" data-pnid-children="DxP3TePCprK1Z10yRRD6oN">
  :root {

    --border: #e3e8f0;

  body {

  /* ---------- 侧边栏：Agent 列表 ---------- */
  .sidebar {
    width: 280px; background: var(--panel); border-right: 1px solid var(--border);

  .agent-item:hover { background: #f0f3fb; }

  .agent-item .name { font-weight: 600; font-size: 14px; }
  .agent-item .desc { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }

  /* ---------- 按钮 ---------- */
  .btn {
    border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px;

  .btn-primary { background: var(--primary); color: #fff; width: 100%; }

  .btn-ghost:hover { background: #f0f3fb; color: var(--text); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-danger-text { color: var(--danger); }

  /* ---------- 主区域 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 60px; background: var(--panel); border-bottom: 1px solid var(--border);

  }

  /* ---------- 对话区 ---------- */
  .chat-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; max-width: 760px; }

  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg.bot { align-self: flex-start; }

  .msg .who { font-size: 12px; color: var(--text2); margin-bottom: 4px; }

<script data-page-node-id="DLWoxGOy006IzPFRSB3C2a" data-pnid-children="FilEcfDiymXXOI4ShNYdmJ">
// ================= 全局状态 =================
let agents = [];
let currentAgent = null;   // 当前对话的 Agent
let history = [];          // 当前对话历史 [{role, content}]
let editingId = null;      // 正在编辑的 Agent id（null = 新建）
const AVATARS = ['🤖','🎋','🌍','✍️','📚','💼','🧑‍🍳','🎨','🧠','🐱','🎯','🔍','📝','💡','🏥','⚖️'];

// ================= 工具函数 =================
const $ = (id) => document.getElementById(id);
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(() => (t.style.display = 'none'), 2500);
}
async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

// ================= Agent 列表 =================
async function loadAgents() {
  agents = await api('/api/agents');
  renderAgentList();
}
function renderAgentList() {
  const box = $('agentList');
  box.innerHTML = '';
  for (const a of agents) {
    const div = document.createElement('div');
    div.className = 'agent-item' + (currentAgent && currentAgent.id === a.id ? ' active' : '');
    div.innerHTML = `<div class="avatar">${a.avatar}</div>
      <div class="info"><div class="name">${esc(a.name)}</div><div class="desc">${esc(a.description)}</div></div>`;
    div.onclick = () => selectAgent(a.id);
    box.appendChild(div);
  }
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ================= 对话 =================
function selectAgent(id) {
  currentAgent = agents.find((a) => a.id === id);
  history = [];
  $('welcome').style.display = 'none';
  $('chatArea').style.display = 'flex';
  $('inputBar').style.display = 'flex';
  $('topTitle').textContent = `${currentAgent.avatar} ${currentAgent.name}`;
  $('chatArea').innerHTML = '';
  renderAgentList();

  // 展示 Agent 介绍卡片
  const intro = document.createElement('div');
  intro.className = 'msg bot';
  const skills = (currentAgent.skills || []).map((s) => '🧩 ' + s.name).join('<br>') || '（暂无技能）';
  intro.innerHTML = `<div class="bubble"><div class="who">${esc(currentAgent.name)} · 自我介绍</div>${esc(currentAgent.description)}<br><br><b>我的技能：</b><br>${skills}</div>`;
  $('chatArea').appendChild(intro);
}

async function send() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text || !currentAgent) return;
  input.value = '';
  addBubble('user', '你', text);

  // 占位的「思考中」气泡
  const loading = addBubble('bot', currentAgent.name, '思考中…');

  try {
    const data = await api(`/api/agents/${currentAgent.id}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history }),
    });
    loading.querySelector('.bubble').textContent = data.reply;
    history.push({ role: 'user', content: text });
    history.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    loading.querySelector('.bubble').textContent = '❌ ' + err.message;
  }
  scrollChat();
}

// 存对话：把当前聊天记录寄给后端保存
async function saveChat() {
  if (!currentAgent || history.length === 0) {
    return toast('聊两句再来存吧');   // 守门员：没聊过天就不寄空包裹
  }
  const data = await api(`/api/agents/${currentAgent.id}/save-history`, {
    method: 'POST',                                  // 寄件
    headers: { 'Content-Type': 'application/json' }, // 标签：内含JSON
    body: JSON.stringify({ messages: history }),     // 货：整个聊天记录
  });
  toast(`✅ 已保存！服务器上共存了 ${data.total} 条记录`);
}

// 知识库：给当前 Agent 喂一段资料（RAG 的「喂书」入口）
async function addKnowledge() {
  if (!currentAgent) {
    return toast('先选中一个 Agent 再喂资料');
  }
  const text = prompt(`给「${currentAgent.name}」添加知识（一段话，比如：本店拿铁12马币，学生证打九折）：`);
  if (!text || !text.trim()) return;   // 点了取消就默默退出

  toast('⏳ 正在把资料变成向量…');
  try {
    const data = await api(`/api/agents/${currentAgent.id}/knowledge`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    toast(`✅ 已入库！${currentAgent.name} 现在有 ${data.total} 条知识（向量 ${data.dims} 维）`);
  } catch (err) {
    toast('❌ ' + err.message);
  }
}


function addBubble(role, who, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble"><div class="who">${esc(who)}</div>${esc(text)}</div>`;
  $('chatArea').appendChild(div);
  scrollChat();
  return div;
}
function scrollChat() { $('chatArea').scrollTop = $('chatArea').scrollHeight; }

// 回车发送
$('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ================= Agent 编辑器 =================
let tempSkills = [];

function openEditor(agent) {
  editingId = agent ? agent.id : null;
  $('editorTitle').textContent = agent ? '编辑 Agent' : '创建我的 Agent';
  $('fName').value = agent ? agent.name : '';
  $('fDesc').value = agent ? agent.description : '';
  $('fPrompt').value = agent ? agent.systemPrompt : '';
  tempSkills = agent ? JSON.parse(JSON.stringify(agent.skills || [])) : [];
  renderAvatarPicker(agent ? agent.avatar : '🤖');
  renderSkills();
  $('editorMask').classList.add('show');
}
function closeEditor() { $('editorMask').classList.remove('show'); }

function renderAvatarPicker(selected) {
  const box = $('avatarPicker');
  box.innerHTML = '';
  AVATARS.forEach((a) => {
    const span = document.createElement('span');
    span.className = 'avatar-option' + (a === selected ? ' selected' : '');
    span.textContent = a;
    span.onclick = () => renderAvatarPicker(a);
    box.appendChild(span);
  });
}
function getSelectedAvatar() {
  return $('avatarPicker').querySelector('.selected')?.textContent || '🤖';
}

function renderSkills() {
  const box = $('skillList');
  box.innerHTML = '';
  tempSkills.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'skill-card';
    card.innerHTML = `
      <div class="skill-head"><span>技能 ${i + 1}</span>
        <button class="btn btn-ghost btn-sm btn-danger-text" onclick="removeSkill(${i})">删除</button></div>
      <input placeholder="技能名称，如：周报生成" value="${esc(s.name)}" oninput="tempSkills[${i}].name=this.value" />
      <input placeholder="技能描述（一句话）" value="${esc(s.description)}" oninput="tempSkills[${i}].description=this.value" />
      <input placeholder="触发词，逗号分隔，如：周报,总结" value="${esc(s.trigger)}" oninput="tempSkills[${i}].trigger=this.value" />
      <textarea rows="3" placeholder="技能内容：命中触发词后注入给模型的详细指令" oninput="tempSkills[${i}].content=this.value">${esc(s.content)}</textarea>`;
    box.appendChild(card);
  });
}
function addSkill() { tempSkills.push({ name: '', description: '', trigger: '', content: '' }); renderSkills(); }
function removeSkill(i) { tempSkills.splice(i, 1); renderSkills(); }

async function saveAgent() {
  const payload = {
    avatar: getSelectedAvatar(),
    name: $('fName').value.trim(),
    description: $('fDesc').value.trim(),
    systemPrompt: $('fPrompt').value.trim(),
    skills: tempSkills.filter((s) => s.name.trim()),
  };
  if (!payload.name || !payload.description || !payload.systemPrompt) {
    return toast('名称、描述、系统提示词都不能为空哦');
  }
  try {
    if (editingId) {
      await api(`/api/agents/${editingId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      await loadAgents();   // 编辑：先刷新本地名单再关窗
    } else {
      const created = await api('/api/agents', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      await loadAgents();   // ★ 修复 bug：先拉最新名单（把新 Agent 装进 agents 数组）
      selectAgent(created.id);  // 再选中它——原来这行在 loadAgents 之前，find 找不到新 Agent，currentAgent 是 undefined，读 avatar 就报错
    }
    closeEditor();
    toast('✅ 保存成功');
  } catch (err) { toast(err.message); }
}

function editCurrent() { if (currentAgent) openEditor(currentAgent); }
async function deleteCurrent() {
  if (!currentAgent) return;
  if (!confirm(`确定删除「${currentAgent.name}」吗？`)) return;
  await api(`/api/agents/${currentAgent.id}`, { method: 'DELETE' });
  currentAgent = null;
  $('welcome').style.display = 'flex';
  $('chatArea').style.display = 'none';
  $('inputBar').style.display = 'none';
  $('topTitle').textContent = '欢迎使用 AgentHub';
  await loadAgents();
}

// ================= 模型设置 =================
let presets = {};
async function openSettings() {
  const cfg = await api('/api/config');
  presets = cfg.presets;
  const sel = $('sProvider');
  sel.innerHTML = '';
  Object.entries(presets).forEach(([key, p]) => {
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = p.name;
    sel.appendChild(opt);
  });
  sel.value = cfg.provider;
  $('sKey').value = '';
  $('sKey').placeholder = cfg.hasKey ? `已保存：${cfg.apiKey}（输入新值可覆盖）` : '粘贴你的 API Key（留空则使用演示模式）';
  $('sBase').value = cfg.baseUrl;
  $('sModel').value = cfg.model;
  sel.onchange = () => {
    const p = presets[sel.value];
    $('sBase').value = p.baseUrl; $('sModel').value = p.model;
  };
  $('settingsMask').classList.add('show');
}
function closeSettings() { $('settingsMask').classList.remove('show'); }
async function saveSettings() {
  try {
    await api('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        provider: $('sProvider').value,
        baseUrl: $('sBase').value.trim(),
        model: $('sModel').value.trim(),
        apiKey: $('sKey').value, // 空字符串=清除，不动=不修改（用特殊标记）
      }),
    });
    closeSettings();
    await refreshBadge();
    toast('✅ 模型设置已保存');
  } catch (err) { toast(err.message); }
}
async function refreshBadge() {
  const cfg = await api('/api/config');
  const badge = $('modelBadge');
  if (cfg.hasKey) {
    badge.textContent = `✅ ${cfg.model}`;
    badge.className = 'badge-demo badge-ok';
  } else {
    badge.textContent = '⚠ 演示模式 · 点击配置模型';
    badge.className = 'badge-demo';
  }
}

// ================= 初始化 =================
loadAgents();
refreshBadge();
</script>
</body>
</html>
